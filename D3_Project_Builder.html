$('#importPNG').onclick=()=>$('#filePNG').click();$('#filePNG').onchange=async e=>{let f=e.target.files[0];e.target.value='';if(!f)return;try{if(f.size>MAXFILE)throw Error('PNG больше 40 MB.');let im=await imageData(await fileData(f));let w=im.naturalWidth,h=im.naturalHeight;if(!w||!h||w*h>32e6||Math.max(w,h)>8192)throw Error('Лимит PNG в прототипе: 8192 px по стороне и 32 Мп.');let cn=document.createElement('canvas');cn.width=w;cn.height=h;let c=cn.getContext('2d',{willReadFrequently:true});c.drawImage(im,0,0);let d=c.getImageData(0,0,w,h),alpha=false;for(let i=3;i<d.data.length;i+=4)if(d.data[i]<250){alpha=true;break}modal('Импорт PNG-маски',`<p>${safe(f.name)} · ${w} × ${h} px</p><div class="field"><label>Источник маски</label><select id="maskSource"><option value="alpha" ${alpha?'selected':''}>Альфа-канал</option><option value="white" ${alpha?'':'selected'}>Белое = видимо</option><option value="black">Чёрное = видимо</option></select></div><div class="field"><label>Pixel pitch · мм</label><input id="maskPitch" type="number" min=".01" max="1000" step=".1" value="2.5"></div><div class="field"><label>Геометрия</label><select id="maskGeometry"><option value="rect">Прямоугольник + маска</option><option value="contour">Контур (прибл.)</option></select></div><p>Контур строится по сетке до 256 × 256; UV остаются в координатах исходного PNG. Цвет нормализуется в белый с прозрачностью.</p>`,()=>{let pitch=Number($('#maskPitch').value);if(!Number.isFinite(pitch)||pitch<=0||pitch>1000)throw Error('Введите корректный pixel pitch.');let mode=$('#maskSource').value,geometry=$('#maskGeometry').value;for(let i=0;i<d.data.length;i+=4){let a=d.data[i+3]/255,l=(.2126*d.data[i]+.7152*d.data[i+1]+.0722*d.data[i+2])/255;let mask=mode==='alpha'?a:mode==='white'?a*l:a*(1-l);d.data[i]=d.data[i+1]=d.data[i+2]=255;d.data[i+3]=Math.round(255*mask)}c.putImageData(d,0,0);let rs=maskRects(cn);if(!rs.length)throw Error('Маска не содержит непрозрачных участков на выбранном пороге.');let o=make(' function parseOBJ(raw){let vertices=[],uvs=[],faces=[];for(let row of raw.split(/\r?\n/)){let a=row.split('#',1)[0].trim().split(/\s+/);if(a[0]==='v'){let p=a.slice(1,4).map(Number);if(p.length!==3||!p.every(Number.isFinite))throw Error('Некорректная вершина OBJ.');vertices.push(p)}else if(a[0]==='vt'){let p=a.slice(1,3).map(Number);if(p.length!==2||!p.every(Number.isFinite))throw Error('Некорректные UV OBJ.');uvs.push(p)}else if(a[0]==='f'){let f=a.slice(1).filter(x=>!x.startsWith('#')).map(s=>{let [v,t]=s.split('/'),vi=Number(v),ti=t?Number(t):0;let x=vi<0?vertices.length+vi:vi-1,y=ti<0?uvs.length+ti:ti>0?ti-1:-1;if(!Number.isInteger(x)||x<0||x>=vertices.length||!Number.isInteger(y)||y< -1||y>=uvs.length)throw Error('Некорректный индекс OBJ.');return [x,y]});if(f.length<3||f.length>64)throw Error('Поддерживаются грани из 3–64 вершин.');faces.push(f)}if(vertices.length>MAXOBJ*3||faces.length>MAXOBJ||uvs.length>MAXOBJ*3)throw Error('Превышен лимит модели для прототипа.')}if(!vertices.length||!faces.length)throw Error('В OBJ нет полигональной геометрии.');return{vertices,uvs,faces,hasUV:faces.every(f=>f.every(p=>p[1]>=0))}}

function exportOBJ(objects,scene=true){let lines=['# D3 Project Builder 0.2.4 | units: meters | Y up',' # Verify coordinate convention in Designer before import'];let vi=1,ti=1;for(let o of objects){if(o.type==='projector')continue;lines.push('o '+o.name.replace(/[^\w.-]/g,'_'));for(let face of mesh(o,true)){let p=face.v.map(v=>scene?world(o,v):mul(v,o.scale));let hasUV=o.type!=='model'||o.hasUV;for(let v of p)lines.push('v '+v.map(x=>fmt(x,7)).join(' '));if(hasUV)for(let uv of face.uv)lines.push('vt '+uv.map(x=>fmt(x,7)).join(' '));lines.push('f '+p.map((_,i)=>hasUV?`${vi+i}/${ti+i}`:String(vi+i)).join(' '));vi+=p.length;if(hasUV)ti+=p.length}}if(vi===1){say('Нет геометрии для экспорта.','warn');return}download((scene?project.name:objects[0].name)+'.obj',lines.join('\n')+'\n','text/plain');say('OBJ выгружен.','good')}
function pattern(o){let [w,h]=resolution(o);if(w<1||h<1||w*h>32e6||Math.max(w,h)>8192){say('Для тестовой PNG лимит 8192 px по стороне и 32 Мп.','warn');alert('Разрешение превышает лимит тестового генератора.');return}let c=document.createElement('canvas');c.width=w;c.height=h;let g=c.getContext('2d');g.fillStyle='#11151b';g.fillRect(0,0,w,h);let cols=['led','ring','curve'].includes(o.type)?Math.min(o.cols,512):16,rows=['led','ring','curve'].includes(o.type)?Math.min(o.rows,512):9;g.strokeStyle='#7d8c99';g.lineWidth=Math.max(1,Math.min(w,h)/600);for(let i=0;i<=cols;i++){g.beginPath();g.moveTo(i*w/cols,0);g.lineTo(i*w/cols,h);g.stroke()}for(let j=0;j<=rows;j++){g.beginPath();g.moveTo(0,j*h/rows);g.lineTo(w,j*h/rows);g.stroke()}g.strokeStyle='#ffcb74';g.lineWidth=Math.max(2,Math.min(w,h)/240);g.strokeRect(g.lineWidth/2,g.lineWidth/2,w-g.lineWidth,h-g.lineWidth);g.beginPath();g.moveTo(0,0);g.lineTo(w,h);g.moveTo(w,0);g.lineTo(0,h);g.stroke();let fs=Math.max(9,Math.min(w/Math.max(14,o.name.length)*1.3,h*.075));g.fillStyle='#10151c';g.fillRect(w*.08,h*.40,w*.84,h*.22);g.fillStyle='#fff';g.textAlign='center';g.textBaseline='middle';g.font=`bold ${fs}px sans-serif`;g.fillText(o.name,w/2,h*.46,w*.8);g.font=`${fs*.64}px sans-serif`;g.fillText(`${w} × ${h} px`,w/2,h*.56,w*.8);let done=()=>c.toBlob(blob=>{if(blob)download(o.name+'_test.png',blob,'image/png');else say('Ошибка генерации PNG.','bad')},'image/png');if(o.type==='mask'){imageData(o.image).then(img=>{g.globalCompositeOperation='destination-in';g.drawImage(img,0,0,w,h);done()}).catch(e=>say(e.message,'bad'))}else done()}
function autoPackFeeds(){let s=project.server,total=s.count*s.outputs,outs=Array.from({length:total},(_,i)=>({i,items:[],free:[{x:0,y:0,w:s.width,h:s.height}]})),unplaced=[],warnings=[],tiles=[];for(let o of project.objects.filter(o=>isFeedSource(o))){let [w,h]=resolution(o);if(o.type==='projector'){if(w>s.width||h>s.height){unplaced.push({id:o.id,name:o.name,w,h,reason:'Растр больше выхода'});continue}if(!s.split&&(w!==s.width||h!==s.height))warnings.push(o.name+': требуется отдельный режим выхода '+w+' × '+h+'; текущий растр не native.');tiles.push({o,w,h,sx:0,sy:0,dedicated:!s.split});continue}let nx=Math.ceil(w/s.width),ny=Math.ceil(h/s.height);if(nx*ny>4096){unplaced.push({id:o.id,name:o.name,w,h,reason:'Слишком много фрагментов'});continue}let led=['led','ring','curve'].includes(o.type);let stepW=led&&o.pxW<=s.width?Math.floor(s.width/o.pxW)*o.pxW:s.width,stepH=led&&o.pxH<=s.height?Math.floor(s.height/o.pxH)*o.pxH:s.height;if(Math.ceil(w/stepW)*Math.ceil(h/stepH)>4096){unplaced.push({id:o.id,name:o.name,w,h,reason:'Слишком много фрагментов'});continue}for(let y=0;y<h;y+=stepH)for(let x=0;x<w;x+=stepW)tiles.push({o,w:Math.min(stepW,w-x),h:Math.min(stepH,h-y),sx:x,sy:y,dedicated:false})}tiles.sort((a,b)=>Number(b.dedicated)-Number(a.dedicated)||b.w*b.h-a.w*a.h);for(let t of tiles){let best=null;for(let out of outs){if(t.dedicated&&out.items.length)continue;for(let r of out.free){if(t.w<=r.w&&t.h<=r.h){let score=(out.items.length?0:1e12)+r.w*r.h-t.w*t.h;if(!best||score<best.score)best={out,r,score}}}}if(!best){unplaced.push({id:t.o.id,name:t.o.name,w:t.w,h:t.h,reason:'Не хватает места / выходов',sx:t.sx,sy:t.sy});continue}let {out,r}=best;let item={id:t.o.id,name:t.o.name,color:t.o.color,w:t.w,h:t.h,x:r.x,y:r.y,sx:t.sx,sy:t.sy,dedicated:t.dedicated};out.items.push(item);out.free=out.free.filter(a=>a!==r);if(!t.dedicated){if(r.w>t.w)out.free.push({x:r.x+t.w,y:r.y,w:r.w-t.w,h:t.h});if(r.h>t.h)out.free.push({x:r.x,y:r.y+t.h,w:r.w,h:r.h-t.h})}}return{outs,unplaced,wa ><span class="spacer"></span><span class="muted">${fmt(100*out.items.reduce((a,t)=>a+t.w*t.h,0)/(s.width*s.height),1)}%</span></div><svg viewBox="0 0 ${s.width} ${s.height}" xmlns="http://www.w3.org/2000/svg">${out.items.map(t=>`<rect x="${t.x}" y="${t.y}" width="${t.w}" height="${t.h}" fill="${t.color}" fill-opacity=".40" stroke="${t.color}" stroke-width="${Math.max(1,s.width/400)}"/><text x="${t.x+t.w/2}" y="${t.y+t.h/2}" text-anchor="middle" fill="#e2e8ef" font-size="${Math.max(1,Math.min(t.h/5,t.w/Math.max(10,t.name.length),s.width/35))}">${safe(t.name)}</text>`).join('')}</svg><table class="listtable"><tr><th>Источник</th><th>Source XY</th><th>Размер</th><th>Out XY</th></tr>${out.items.map(t=>`<tr><td>${safe(t.name)}</td><td>${t.sx}, ${t.sy}</td><td>${t.w} × ${t.h}</td><td>${t.x}, ${t.y}</td></tr>`).join('')}</table></div>`).join('')}<p>Раскладка — эвристика, не гарантирует оптимум. Не проверяет GPU, EDID, VFC, физическую полосу и возможности процессора. Проекционная поверхность не является отдельным физическим выходом. В CSV включаются все выходы.</p></div>`;if(keepForm&&$('#feedResults')){let t=document.createElement('template');t.innerHTML=markup;$('#feedResults').replaceWith(t.content.querySelector('#feedResults'))}else $('#feed').innerHTML=markup;
